[project]
name = "storybook-storage-service"
version = "0.1.0"
description = "Storybook Storage Service — self-hosted blob storage (ADR-054) replacing Supabase Storage. FastAPI + BlobDriver seam (local-fs v1). No DB, no Supabase SDK, no AI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.12.0",
    "pyjwt[crypto]>=2.10.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error:coroutine .* was never awaited:RuntimeWarning",
]
